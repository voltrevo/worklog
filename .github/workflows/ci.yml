# The same gate a laptop runs, and then the Pages deploy.
#
# `deno task gate` is the whole check — format, lint, types, tests, and the browser build. Nothing
# here knows how to check this project; if CI and a laptop ever disagree, the disagreement is in the
# environment rather than in two descriptions of the same steps that have drifted apart.
#
# Enable the deploy once under Settings → Pages → Source → GitHub Actions.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The task, not a copy of what it does. It installs both package.json files, and CI having
      # its own second line is why the documented setup went untested: a fresh clone following the
      # README reached `tsc: command not found` while CI was green.
      - name: Install dependencies
        run: deno task deps

      - run: deno task gate

      # 1.18 — the Pages artefact is `web/dist`, which `gate` has just built.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/dist

  # 23.5, 23.7 — the two browser harnesses. Separate from `gate` because they need a browser and
  # take minutes rather than seconds, and because a red one means something different: `gate` says
  # the code is wrong, these say the product does not work.
  #
  # `npx playwright install` is fine *here*. It is forbidden on the development machine, where the
  # download CDN is unreachable and the command empties a browser cache several harnesses share —
  # see `requireBrowser` in `tools/harness.mjs`.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: deno task deps
          npx playwright install --with-deps chromium

      # Playwright's own Chromium, found the ordinary way. `harness.mjs` insists on being told
      # rather than guessing, so tell it.
      - name: Locate the browser
        run: |
          echo "CHROME_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      # The desktop shell, which needs a display and a WebKitGTK. Its bridge is the only thing
      # between the desktop window and a shell that silently does nothing, and it was exactly that
      # for as long as it existed.
      - name: Desktop bridge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libwebkit2gtk-4.1-0
          xvfb-run -a deno task desktop:check

      - run: deno task journey

      # Regenerated, never committed from CI: the pacing figures move with the clock, so every run
      # would produce a diff. This checks they still render and that no screen throws.
      - run: deno task shots

      # 27.50 — and the copy strangers actually load, served from a repo subpath rather than from
      # the root of a host. An absolute base, manifest href or worker scope fails only there.
      - run: deno task pages

  deploy:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
